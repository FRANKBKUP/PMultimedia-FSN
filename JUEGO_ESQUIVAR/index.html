<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Juego - Esquivar Obstáculos</title>
    <link href="css/estilo.css" type="text/css" rel="stylesheet">
</head>

<body>
    <div id="contenedor">
        <div id="header">
            <h1>Juego: Esquivar Obstáculos FSN</h1>
            <div id="info">
                <span>Puntuación: <span id="puntuacion">0</span></span>
                <span id="estado">Presiona ESPACIO para comenzar</span>
            </div>
        </div>

        <canvas id="lienzo" width="800" height="600"></canvas>

        <div id="controles">
            <p><strong>Controles:</strong></p>
            <p>← → Mover jugador</p>
            <p>ESPACIO - Comenzar/Reiniciar</p>
            <p>Esquiva los círculos rojos y alcanza la máxima puntuación</p>
        </div>
    </div>

    <script src="js/canvas.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
